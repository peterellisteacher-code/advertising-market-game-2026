<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base href="/">
    <title>$GODOT_PROJECT_NAME</title>
    $GODOT_HEAD_INCLUDE
    <link rel="stylesheet" href="./studio/studio.css">
    <style>
      :root {
        --space-2: .65rem;
        --space-3: .85rem;
      }
      html {
        width: 100%;
        height: 100%;
      }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
      }
      body:not(:has([data-admarket-route="teacher-dashboard"])) {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
      }
      body > main {
        width: 100%;
        height: 100%;
      }
      /* Godot writes the canvas width and height attributes in device pixels. An
         unstyled canvas is inline and lays those out as CSS pixels, so above 100%
         display scaling the game overflows the viewport and its edges are cut off. */
      #canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        border: 0;
        outline: none;
      }
      .game-skip-link {
        position: fixed;
        top: .75rem;
        left: .75rem;
        z-index: 500;
        padding: var(--space-2) var(--space-3);
        border: 3px solid #172033;
        border-radius: .5rem;
        background: #fffaf2;
        color: #07536f;
        font: 900 1rem/1.2 "Trebuchet MS", "Aptos", "Segoe UI", sans-serif;
        transform: translateY(calc(-100% - 1.5rem));
      }
      .game-skip-link:focus {
        transform: none;
      }
    </style>
  </head>
  <body>
    <div id="account-gate-root"></div>
    <section id="account-session-root" hidden></section>
    <main aria-label="Advertising Market Game" hidden inert aria-hidden="true">
      <a class="game-skip-link" href="#canvas">Skip to game controls</a>
      <canvas id="canvas" tabindex="-1" aria-label="Advertising Market Game canvas">Your browser does not support the canvas element.</canvas>
      <section
        id="game-startup-status"
        class="game-startup-status"
        role="status"
        aria-live="polite"
        aria-label="Game startup"
      >
        <strong data-game-startup-heading>Opening Agency Academy</strong>
        <span data-game-startup-message>Preparing the game…</span>
      </section>
      <section id="game-a11y" class="sr-only" aria-live="polite" aria-atomic="true">
        <p id="game-a11y-eyebrow"></p>
        <h1 id="game-a11y-heading"></h1>
        <p id="game-a11y-clue"></p>
        <p id="game-a11y-status"></p>
      </section>
    </main>
    <div id="creator-root" hidden></div>
    <script src="./studio/studio.js"></script>
    <script src="$GODOT_URL"></script>
    <script>
      const reducedMotionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
      const reducedMotionSubscribers = new Set();
      const notifyReducedMotion = () => {
        for (const callback of reducedMotionSubscribers) {
          try {
            callback(reducedMotionQuery.matches);
          } catch {
            // A stale engine callback must not break the page shell.
          }
        }
      };
      if (typeof reducedMotionQuery.addEventListener === "function") {
        reducedMotionQuery.addEventListener("change", notifyReducedMotion);
      } else {
        reducedMotionQuery.addListener(notifyReducedMotion);
      }
      window.AdMarketGameA11y = Object.freeze({
        update(payload) {
          let next;
          try {
            next = typeof payload === "string" ? JSON.parse(payload) : payload;
          } catch {
            return false;
          }
          if (!next || typeof next !== "object") return false;
          for (const key of ["eyebrow", "heading", "clue", "status"]) {
            const target = document.querySelector(`#game-a11y-${key}`);
            if (target) target.textContent = typeof next[key] === "string" ? next[key] : "";
          }
          return true;
        },
        reducedMotion() {
          return reducedMotionQuery.matches;
        },
        watchReducedMotion(callback) {
          if (typeof callback !== "function") return false;
          reducedMotionSubscribers.add(callback);
          callback(reducedMotionQuery.matches);
          return true;
        }
      });
      class GameStartupTimeoutError extends Error {}

      function withStartupTimeout(startup, timeoutMs) {
        return new Promise((resolve, reject) => {
          const timeout = window.setTimeout(
            () => reject(new GameStartupTimeoutError("Game startup timed out")),
            timeoutMs
          );
          Promise.resolve(startup).then(
            (value) => {
              window.clearTimeout(timeout);
              resolve(value);
            },
            (error) => {
              window.clearTimeout(timeout);
              reject(error);
            }
          );
        });
      }

      const GAME_ACCESS_RECOVERY_KEY = "admarket-game-access-recovery";
      const GAME_ACCESS_RECOVERY_QUERY = "gameAccessRecovery";
      const RELEASE_MARKER_KEY = "admarket-release-marker";
      let gameAccessRecoveryReloadScheduled = false;

      function currentReleaseMarker() {
        const studioScript = document.querySelector('script[src*="studio/studio.js"]');
        if (!(studioScript instanceof HTMLScriptElement)) return "";
        try {
          return new URL(studioScript.src, window.location.href).searchParams.get("v") || "";
        } catch {
          return "";
        }
      }

      async function prepareReleaseAssets() {
        const marker = currentReleaseMarker();
        if (!marker || !("serviceWorker" in navigator)) return true;

        let previousMarker = "";
        try {
          previousMarker = window.localStorage.getItem(RELEASE_MARKER_KEY) || "";
        } catch {
          // The controller check below still makes recovery self-limiting.
        }

        if (navigator.serviceWorker.controller && previousMarker !== marker) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
          try {
            window.localStorage.setItem(RELEASE_MARKER_KEY, marker);
          } catch {
            // After unregistering, the reloaded page has no stale controller.
          }
          window.location.reload();
          return false;
        }

        try {
          window.localStorage.setItem(RELEASE_MARKER_KEY, marker);
        } catch {
          // Release recovery does not require persistent browser storage.
        }
        return true;
      }

      function renderGameAccessFailure() {
        const gateRoot = document.getElementById("account-gate-root");
        if (!gateRoot) return;
        gateRoot.hidden = false;
        gateRoot.className = "account-access";
        const panel = document.createElement("section");
        panel.className = "account-access__card";
        const heading = document.createElement("h1");
        heading.textContent = "The game could not start";
        const message = document.createElement("p");
        message.setAttribute("role", "alert");
        message.textContent = "Reload this page to try again.";
        const retry = document.createElement("button");
        retry.type = "button";
        retry.textContent = "Reload game";
        retry.addEventListener("click", () => window.location.reload());
        panel.append(heading, message, retry);
        gateRoot.replaceChildren(panel);
        queueMicrotask(() => retry.focus());
      }

      function gameAccessRecoveryAlreadyTried() {
        try {
          const url = new URL(window.location.href);
          if (url.searchParams.get(GAME_ACCESS_RECOVERY_QUERY) === "1") return true;
        } catch {
          // The storage marker below remains the primary recovery path.
        }
        try {
          if (sessionStorage.getItem(GAME_ACCESS_RECOVERY_KEY) === "1") return true;
          sessionStorage.setItem(GAME_ACCESS_RECOVERY_KEY, "1");
          return false;
        } catch {
          try {
            const url = new URL(window.location.href);
            url.searchParams.set(GAME_ACCESS_RECOVERY_QUERY, "1");
            window.history.replaceState(null, "", `${url.pathname}${url.search}${url.hash}`);
            return false;
          } catch {
            return true;
          }
        }
      }

      function clearGameAccessRecovery() {
        try {
          sessionStorage.removeItem(GAME_ACCESS_RECOVERY_KEY);
        } catch {
          // Storage is optional; also clear the URL fallback below.
        }
        try {
          const url = new URL(window.location.href);
          if (!url.searchParams.has(GAME_ACCESS_RECOVERY_QUERY)) return;
          url.searchParams.delete(GAME_ACCESS_RECOVERY_QUERY);
          window.history.replaceState(null, "", `${url.pathname}${url.search}${url.hash}`);
        } catch {
          // The live access controller is already available.
        }
      }

      if (!window.AdMarketGameAccess) {
        window.AdMarketGameAccess = Object.freeze({
          requireAccess() {
            return Promise.reject(new Error("Game access controller unavailable"));
          },
          reportStartupProgress() {},
          reportStartupReady() {},
          reportStartupFailure() {
            if (gameAccessRecoveryReloadScheduled) return;
            if (!gameAccessRecoveryAlreadyTried()) {
              gameAccessRecoveryReloadScheduled = true;
              window.setTimeout(() => {
                gameAccessRecoveryReloadScheduled = false;
                window.location.reload();
              }, 250);
              return;
            }
            renderGameAccessFailure();
          }
        });
      } else {
        clearGameAccessRecovery();
      }

      async function startGame() {
        try {
          if (!await prepareReleaseAssets()) return;
          await window.AdMarketGameAccess.requireAccess();
          const engine = new Engine($GODOT_CONFIG);
          await withStartupTimeout(engine.startGame({
            onProgress(current, total) {
              if (total > 0) {
                window.AdMarketGameAccess.reportStartupProgress(current / total * 100);
              }
            }
          }), 120_000);
          window.AdMarketGameAccess.reportStartupReady();
        } catch (error) {
          const reason = error instanceof GameStartupTimeoutError ? "timeout" : "engine";
          window.AdMarketGameAccess.reportStartupFailure(reason);
          console.error("[AdMarket game startup failed]", {
            reason,
            errorName: error instanceof Error ? error.name : "UnknownError"
          });
        }
      }

      startGame();
    </script>
  </body>
</html>
