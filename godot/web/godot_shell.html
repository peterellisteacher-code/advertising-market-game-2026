<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base href="/">
    <title>$GODOT_PROJECT_NAME</title>
    $GODOT_HEAD_INCLUDE
    <link rel="stylesheet" href="./studio/studio.css">
    <style>
      html {
        width: 100%;
        height: 100%;
      }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
      }
      body:not(:has([data-admarket-route="teacher-dashboard"])) {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
      }
      .game-skip-link {
        --game-skip-link-padding: .65rem .85rem;
        position: fixed;
        top: .75rem;
        left: .75rem;
        z-index: 500;
        padding: var(--game-skip-link-padding);
        border: 3px solid #172033;
        border-radius: .5rem;
        background: #fffaf2;
        color: #07536f;
        font: 900 1rem/1.2 "Trebuchet MS", "Aptos", "Segoe UI", sans-serif;
        transform: translateY(calc(-100% - 1.5rem));
      }
      .game-skip-link:focus {
        transform: none;
      }
    </style>
  </head>
  <body>
    <div id="account-gate-root"></div>
    <section id="account-session-root" hidden></section>
    <main aria-label="Advertising Market Game" hidden inert aria-hidden="true">
      <a class="game-skip-link" href="#canvas">Skip to game controls</a>
      <canvas id="canvas" tabindex="-1" aria-label="Advertising Market Game canvas">Your browser does not support the canvas element.</canvas>
      <section
        id="game-startup-status"
        class="game-startup-status"
        role="status"
        aria-live="polite"
        aria-label="Game startup"
      >
        <strong data-game-startup-heading>Loading Ad Market</strong>
        <span data-game-startup-message>Preparing the game…</span>
      </section>
      <section id="game-a11y" class="sr-only" aria-live="polite" aria-atomic="true">
        <p id="game-a11y-eyebrow"></p>
        <h1 id="game-a11y-heading"></h1>
        <p id="game-a11y-clue"></p>
        <p id="game-a11y-status"></p>
      </section>
    </main>
    <div id="creator-root" hidden></div>
    <script src="./studio/studio.js"></script>
    <script src="$GODOT_URL"></script>
    <script>
      window.AdMarketGameA11y = Object.freeze({
        update(payload) {
          let next;
          try {
            next = typeof payload === "string" ? JSON.parse(payload) : payload;
          } catch {
            return false;
          }
          if (!next || typeof next !== "object") return false;
          for (const key of ["eyebrow", "heading", "clue", "status"]) {
            const target = document.querySelector(`#game-a11y-${key}`);
            if (target) target.textContent = typeof next[key] === "string" ? next[key] : "";
          }
          return true;
        }
      });
      class GameStartupTimeoutError extends Error {}

      function withStartupTimeout(startup, timeoutMs) {
        return new Promise((resolve, reject) => {
          const timeout = window.setTimeout(
            () => reject(new GameStartupTimeoutError("Game startup timed out")),
            timeoutMs
          );
          Promise.resolve(startup).then(
            (value) => {
              window.clearTimeout(timeout);
              resolve(value);
            },
            (error) => {
              window.clearTimeout(timeout);
              reject(error);
            }
          );
        });
      }

      const engine = new Engine($GODOT_CONFIG);
      window.AdMarketGameAccess.requireAccess().then(() => withStartupTimeout(engine.startGame({
        onProgress(current, total) {
          if (total > 0) {
            window.AdMarketGameAccess.reportStartupProgress(current / total * 100);
          }
        }
      }), 45_000)).then(() => {
        window.AdMarketGameAccess.reportStartupReady();
      }).catch((error) => {
        const reason = error instanceof GameStartupTimeoutError ? "timeout" : "engine";
        if (reason === "timeout") {
          window.AdMarketGameAccess.reportStartupFailure("timeout");
        } else {
          window.AdMarketGameAccess.reportStartupFailure("engine");
        }
        console.error("[AdMarket game startup failed]", { reason });
      });
    </script>
  </body>
</html>
