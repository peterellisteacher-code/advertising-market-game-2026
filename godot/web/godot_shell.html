<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>$GODOT_PROJECT_NAME</title>
    $GODOT_HEAD_INCLUDE
    <link rel="stylesheet" href="./studio/studio.css">
  </head>
  <body>
    <main aria-label="Advertising Market Game">
      <canvas id="canvas" tabindex="0" aria-label="Advertising Market Game canvas">Your browser does not support the canvas element.</canvas>
    </main>
    <div id="creator-root" hidden></div>
    <p id="status" role="status" aria-live="polite">Loading game…</p>
    <script src="./studio/studio.js"></script>
    <script src="$GODOT_URL"></script>
    <script>
      const engine = new Engine($GODOT_CONFIG);
      engine.startGame({
        onProgress(current, total) {
          const status = document.querySelector("#status");
          if (status && total > 0) status.textContent = `Loading game… ${Math.round(current / total * 100)}%`;
        }
      }).then(() => {
        const status = document.querySelector("#status");
        if (status) status.textContent = "Game ready";
      }).catch((error) => {
        const status = document.querySelector("#status");
        if (status) status.textContent = `Unable to start: ${error.message}`;
        console.error(error);
      });
    </script>
  </body>
</html>
