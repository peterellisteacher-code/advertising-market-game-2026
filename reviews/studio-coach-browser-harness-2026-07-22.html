<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Coach browser evidence</title>
    <link rel="stylesheet" href="/build/studio/studio.css">
  </head>
  <body>
    <main aria-label="Advertising Market Game" hidden inert aria-hidden="true">
      <canvas id="canvas" tabindex="-1" aria-label="Advertising Market Game canvas"></canvas>
    </main>
    <div
      id="creator-root"
      data-offline-catalogue-url="/catalog/generated/offline-core-v1/catalog.json"
      data-product-builder-catalogue-url="/catalog/generated/product-builder-pilot-v1/catalogue.json"
      data-product-shell-catalogue-url="/catalog/generated/product-shells-v1-reviewed/catalog.json"
      data-logo-icon-catalogue-url="/catalog/generated/logo-icons-v1-reviewed/catalog.json"
    ></div>
    <script>
      const originalFetch = window.fetch.bind(window);
      window.fetch = async (input, init) => {
        const url = typeof input === "string" ? input : input.url;
        if (url === "/api/account/session") {
          return new Response(JSON.stringify({ authenticated: true, username: "browserpair" }), {
            status: 200,
            headers: { "content-type": "application/json" }
          });
        }
        if (url === "/api/account/progress" && (init?.method ?? "GET") === "GET") {
          return new Response(JSON.stringify({
            schema: "advertising-game-progress",
            version: 1,
            documents: []
          }), {
            status: 200,
            headers: { "content-type": "application/json" }
          });
        }
        if (url === "/api/account/progress" && init?.method === "PUT") {
          const progress = JSON.parse(String(init.body));
          return new Response(JSON.stringify({
            schema: "advertising-game-progress",
            version: 1,
            documentId: progress.documentId,
            revision: Number(progress.expectedRevision) + 1,
            updatedAt: "2026-07-22T00:00:00.000Z"
          }), {
            status: 200,
            headers: { "content-type": "application/json" }
          });
        }
        if (url !== "/api/image-lab/coach") return originalFetch(input, init);
        const request = JSON.parse(String(init?.body ?? "{}"));
        const response = request.turn === 1
          ? {
              turn: 1,
              mode: request.mode,
              observation: "The product name is easy to see, but it sits alone without a second visual step.",
              effect: "The eye reaches the name, then has no clear path to the price or product benefit.",
              nextMove: "Keep the existing words. Change their size and placement so the product name leads to the price.",
              selfCheck: "Does your eye move from the product name to the price without searching?",
              evidenceRefs: ["canvas"],
              certainty: "clear"
            }
          : {
              turn: 2,
              mode: "revision",
              verdict: "clearer",
              whatChanged: "The product name now leads into the added price message.",
              why: "The two elements create a clearer first and second step for the viewer.",
              evidenceRefs: ["canvas"],
              certainty: "clear"
            };
        return new Response(JSON.stringify(response), {
          status: 200,
          headers: { "content-type": "application/json" }
        });
      };
    </script>
    <script src="/build/studio/studio.js"></script>
    <script>
      (async () => {
        await window.AdMarketAccount.requireAccess();
        const begin = JSON.parse(await window.AdMarketPractice.handle(JSON.stringify({
          contract: "practice-run@1",
          requestId: "browser-coach-begin",
          method: "begin",
          payload: { teamAlias: "Orbit Pair", operationId: "browser-coach-begin-op" }
        })));
        if (!begin.ok) throw new Error(begin.error?.message ?? "Practice did not begin");
        let recovery = begin.payload;
        if (recovery.checkpoint.stage === "invent") {
          const checkpoint = recovery.checkpoint;
          const advance = JSON.parse(await window.AdMarketPractice.handle(JSON.stringify({
            contract: "practice-run@1",
            requestId: "browser-coach-advance",
            method: "advance",
            payload: {
              checkpoint: {
                runId: checkpoint.runId,
                documentId: checkpoint.documentId,
                documentRevision: checkpoint.documentRevision,
                sequence: checkpoint.sequence,
                stage: checkpoint.stage
              },
              nextStage: "sell",
              operationId: "browser-coach-advance-op"
            }
          })));
          if (!advance.ok) throw new Error(advance.error?.message ?? "Practice did not advance");
          recovery = advance.payload;
        }
        const documentValue = structuredClone(recovery.document);
        documentValue.product = { name: "Orbit Tumbler", priceCents: 2400, build: null };
        documentValue.brief = {
          targetAudienceId: "after-school-reset",
          contextId: "after-school",
          purpose: "persuade",
          audienceNeeds: ["A drink that is easy to carry after school."],
          audienceValues: ["Convenience", "less waste"],
          intendedEffects: ["Make the tumbler feel practical and worth its price."],
          techniques: []
        };
        const response = JSON.parse(await window.AdMarketCreator.handle(JSON.stringify({
          contract: "creator-bridge@1",
          requestId: "browser-coach-open",
          method: "open",
          payload: documentValue
        })));
        if (!response.ok) throw new Error(response.error?.message ?? "Creator did not open");
        window.__coachHarnessReady = true;
      })().catch((error) => {
        document.body.dataset.harnessError = error instanceof Error ? error.message : String(error);
      });
    </script>
  </body>
</html>
