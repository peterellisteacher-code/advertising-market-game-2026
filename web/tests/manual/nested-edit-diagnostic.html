<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested product-artwork editing diagnostic</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #d9d4c8; color: #172033; }
      header {
        position: sticky;
        z-index: 2;
        top: 0;
        display: flex;
        align-items: center;
        gap: 20px;
        min-height: 92px;
        padding: 14px 24px;
        background: rgb(249 247 241 / 94%);
        border-bottom: 1px solid #b8af9d;
        backdrop-filter: blur(10px);
      }
      h1 { margin: 0; font-size: 20px; }
      #status { margin: 4px 0 0; font-weight: 700; }
      #checkpoints { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
      #checkpoints span {
        padding: 6px 10px;
        border-radius: 999px;
        background: #e4dfd4;
        color: #5f574b;
        font-size: 13px;
        font-weight: 800;
      }
      #checkpoints span[data-pass="true"] { background: #c9f3dc; color: #11613c; }
      #checkpoints span[data-fail="true"] { background: #ffd4d8; color: #8e2030; }
      main { width: 1648px; margin: 18px auto 32px; }
      .canvas-container {
        margin: 0 auto;
        background: white;
        border: 1px solid #a89f90;
        box-shadow: 0 18px 50px rgb(43 35 24 / 22%);
      }
      #instructions { margin: 14px 24px 0 0; color: #665e52; font-size: 14px; }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Real-browser nested edit spike</h1>
        <p id="status" role="status">Loading the reviewed product shell…</p>
        <p id="instructions">Select the green artwork, move it, resize it, rotate it, then click outside it or press Escape.</p>
      </div>
      <div id="checkpoints" aria-label="Diagnostic checkpoints">
        <span data-check="selection">selection</span>
        <span data-check="move">move</span>
        <span data-check="scale">resize</span>
        <span data-check="rotate">rotate</span>
        <span data-check="clip">clip</span>
        <span data-check="parentInvariant">parent stable</span>
        <span data-check="exit">exit</span>
      </div>
    </header>
    <main>
      <canvas id="diagnostic-canvas" width="1600" height="900"></canvas>
    </main>
    <script type="module" src="./nested-edit-diagnostic.ts"></script>
  </body>
</html>
