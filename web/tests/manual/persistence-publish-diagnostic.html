<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campaign persistence and publication diagnostic</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #e8e4dc; color: #172033; }
      body { margin: 0; padding: 18px; }
      h1 { margin: 0 0 10px; font-size: 24px; }
      #status { margin: 0 0 16px; padding: 12px 16px; background: white; border-radius: 10px; box-shadow: 0 4px 18px rgb(0 0 0 / .08); }
      .canvas-container { max-width: calc(100vw - 36px); margin: 0 auto 16px; background: white; box-shadow: 0 8px 30px rgb(0 0 0 / .16); }
      .canvas-container canvas { max-width: 100%; height: auto; }
      #published-preview { display: block; width: min(800px, 100%); height: auto; margin: 0 auto; background: white; box-shadow: 0 8px 30px rgb(0 0 0 / .16); }
    </style>
  </head>
  <body>
    <h1>Persistence and publication browser diagnostic</h1>
    <p id="status" role="status">Preparing a revisioned save and guarded reload…</p>
    <canvas id="diagnostic-canvas" width="1600" height="900" aria-label="Reloaded editable campaign"></canvas>
    <img id="published-preview" alt="Clean campaign PNG produced after reload" hidden>
    <script type="module" src="./persistence-publish-diagnostic.ts"></script>
  </body>
</html>
