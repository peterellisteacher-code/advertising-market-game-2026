<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masked recolouring diagnostic</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #e8e4dc; color: #172033; }
      body { margin: 0; padding: 20px; }
      h1 { margin: 0 0 12px; font-size: 24px; }
      #status { margin: 0 0 18px; padding: 12px 16px; background: white; border-radius: 10px; box-shadow: 0 4px 18px rgb(0 0 0 / .08); }
      #fixtures { display: grid; grid-template-columns: repeat(4, minmax(150px, 1fr)); gap: 14px; }
      figure { margin: 0; padding: 12px; background: white; border-radius: 12px; box-shadow: 0 4px 18px rgb(0 0 0 / .08); }
      figure img { display: block; width: 100%; image-rendering: pixelated; border-radius: 8px; background: linear-gradient(45deg, #eee 25%, transparent 25%) 0 0 / 16px 16px, linear-gradient(45deg, transparent 75%, #eee 75%) 0 0 / 16px 16px; }
      figcaption { margin-top: 8px; text-transform: capitalize; font-weight: 700; }
      #placement { margin-top: 18px; width: 320px; height: 180px; background: white; border-radius: 10px; }
      @media (max-width: 760px) { #fixtures { grid-template-columns: repeat(2, minmax(130px, 1fr)); } }
    </style>
  </head>
  <body>
    <h1>Masked recolouring browser diagnostic</h1>
    <p id="status" role="status">Rendering and decoding four product categories…</p>
    <section id="fixtures" aria-label="Rendered category fixtures"></section>
    <canvas id="placement" width="320" height="180" aria-label="Fabric placement lifecycle proof"></canvas>
    <script type="module" src="./recolouring-diagnostic.ts"></script>
  </body>
</html>
