<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Round 0 pair-loop browser diagnostic</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { font-family: system-ui, sans-serif; background: #172033; }
      main[aria-label="Advertising Market Game"] { width: 100%; height: 100%; display: grid; place-items: center; }
      main[aria-label="Advertising Market Game"] canvas { width: 100%; height: 100%; }
      #diagnostic-board {
        position: fixed;
        z-index: 500;
        right: 8px;
        bottom: 8px;
        width: min(590px, calc(100vw - 16px));
        padding: 7px 9px;
        border: 1px solid rgb(255 255 255 / .42);
        border-radius: 9px;
        background: rgb(23 32 51 / .92);
        color: white;
        box-shadow: 0 4px 18px rgb(0 0 0 / .26);
        pointer-events: none;
      }
      #diagnostic-board h1 { margin: 0 0 5px; font-size: 12px; letter-spacing: .04em; }
      #diagnostic-board ol { margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 3px; list-style: none; }
      #diagnostic-board li { padding: 3px 5px; border-radius: 4px; background: #4b5563; font-size: 10px; line-height: 1.2; }
      #diagnostic-board li[data-result="pass"] { background: #047857; }
      #diagnostic-board li[data-result="fail"] { background: #b91c1c; }
      #diagnostic-summary { margin: 5px 0 0; font-size: 10px; }
    </style>
  </head>
  <body>
    <main aria-label="Advertising Market Game">
      <canvas id="canvas" tabindex="0"></canvas>
    </main>
    <div
      id="creator-root"
      data-product-builder-catalogue-url="/catalog/generated/product-builder-pilot-v1/catalogue.json"
      data-product-shell-catalogue-url="/catalog/generated/product-shells-v1-reviewed/catalog.json"
    ></div>
    <aside id="diagnostic-board" aria-label="Playtest checkpoints">
      <h1>Round 0 browser checkpoints</h1>
      <ol id="diagnostic-checkpoints"></ol>
      <p id="diagnostic-summary" role="status">Opening the creator…</p>
    </aside>
    <script type="module" src="./round-zero-pair-loop.ts"></script>
  </body>
</html>
